apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql
  namespace: order-management
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mssql

  template:
    metadata:
      labels:
        app: mssql

    spec:
      nodeSelector:
        kubernetes.io/hostname: k8sw1-r

      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest

          ports:
            - containerPort: 1433
              protocol: TCP

          env:
            - name: ACCEPT_EULA
              value: "Y"

            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-secret
                  key: MSSQL_SA_PASSWORD

            - name: MSSQL_PID
              value: "Developer"

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2
              memory: 4Gi

          volumeMounts:
            - name: mssql-data
              mountPath: /var/opt/mssql

      volumes:
        - name: mssql-data
          persistentVolumeClaim:
            claimName: mssql-pvc