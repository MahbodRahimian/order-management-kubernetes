apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-api
  namespace: financial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: financial-api
  template:
    metadata:
      labels:
        app: financial-api
    spec:
      imagePullSecrets:
        - name: nexus-registry
      containers:
        - name: financial-api
          image: nexuss.mahbod.com:8082/order-management/financial-api:3bcb6c08
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: ConnectionStrings__Financial
              valueFrom:
                secretKeyRef:
                  name: financial-db-secret
                  key: ConnectionStrings__Financial
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
