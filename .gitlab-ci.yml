update_kubernetes_manifests:
  stage: docker

  image: docker:27-cli

  needs:
    - docker_build_push_ordermanagement
    - docker_build_push_usermanagement
    - docker_build_push_financial
    - docker_build_push_silo
    - docker_build_push_dispatcher
    - docker_build_push_idp

  script:
    - apk add --no-cache curl yq
    - yq --version

    - export GITLAB_API="http://gitlab.mahbod.com:8080/api/v4"
    - export PROJECT="mahbod1%2Forder-management"

    - export ORDER_FILE="k8s%2Forder-management%2Fdeployment.yaml"
    - export USER_FILE="k8s%2Fusermanagement%2Fdeployment.yaml"
    - export FINANCIAL_FILE="k8s%2Ffinancial%2Fdeployment.yaml"
    - export SILO_FILE="k8s%2Fsilo%2Fdeployment.yaml"
    - export DISPATCHER_FILE="k8s%2Fdispatcher%2Fdeployment.yaml"
    - export IDP_FILE="k8s%2Fidp%2Fdeployment.yaml"

    - export ORDER_IMAGE="${ORDER_IMAGE_NAME}:${IMAGE_TAG}"
    - export USER_IMAGE="${USER_IMAGE_NAME}:${IMAGE_TAG}"
    - export FINANCIAL_IMAGE="${FINANCIAL_IMAGE_NAME}:${IMAGE_TAG}"
    - export SILO_IMAGE="${SILO_IMAGE_NAME}:${IMAGE_TAG}"
    - export DISPATCHER_IMAGE="${DISPATCHER_IMAGE_NAME}:${IMAGE_TAG}"
    - export IDP_IMAGE="${IDP_IMAGE_NAME}:${IMAGE_TAG}"

    - 'echo "OrderManagement image: $ORDER_IMAGE"'
    - 'echo "UserManagement image: $USER_IMAGE"'
    - 'echo "Financial image: $FINANCIAL_IMAGE"'
    - 'echo "Silo image: $SILO_IMAGE"'
    - 'echo "Dispatcher image: $DISPATCHER_IMAGE"'
    - 'echo "IDP image: $IDP_IMAGE"'

    - 'curl --fail --silent --show-error --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" "$GITLAB_API/projects/$PROJECT/repository/files/$ORDER_FILE?ref=main" -o /tmp/order-response.json'
    - 'curl --fail --silent --show-error --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" "$GITLAB_API/projects/$PROJECT/repository/files/$USER_FILE?ref=main" -o /tmp/user-response.json'
    - 'curl --fail --silent --show-error --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" "$GITLAB_API/projects/$PROJECT/repository/files/$FINANCIAL_FILE?ref=main" -o /tmp/financial-response.json'
    - 'curl --fail --silent --show-error --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" "$GITLAB_API/projects/$PROJECT/repository/files/$SILO_FILE?ref=main" -o /tmp/silo-response.json'
    - 'curl --fail --silent --show-error --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" "$GITLAB_API/projects/$PROJECT/repository/files/$DISPATCHER_FILE?ref=main" -o /tmp/dispatcher-response.json'
    - 'curl --fail --silent --show-error --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" "$GITLAB_API/projects/$PROJECT/repository/files/$IDP_FILE?ref=main" -o /tmp/idp-response.json'

    - 'cat /tmp/order-response.json | yq -r ".content" | base64 -d > /tmp/order-deployment.yaml'
    - 'cat /tmp/user-response.json | yq -r ".content" | base64 -d > /tmp/user-deployment.yaml'
    - 'cat /tmp/financial-response.json | yq -r ".content" | base64 -d > /tmp/financial-deployment.yaml'
    - 'cat /tmp/silo-response.json | yq -r ".content" | base64 -d > /tmp/silo-deployment.yaml'
    - 'cat /tmp/dispatcher-response.json | yq -r ".content" | base64 -d > /tmp/dispatcher-deployment.yaml'
    - 'cat /tmp/idp-response.json | yq -r ".content" | base64 -d > /tmp/idp-deployment.yaml'

    - 'yq -i ".spec.template.spec.containers[0].image = strenv(ORDER_IMAGE)" /tmp/order-deployment.yaml'
    - 'yq -i ".spec.template.spec.containers[0].image = strenv(USER_IMAGE)" /tmp/user-deployment.yaml'
    - 'yq -i ".spec.template.spec.containers[0].image = strenv(FINANCIAL_IMAGE)" /tmp/financial-deployment.yaml'
    - 'yq -i ".spec.template.spec.containers[0].image = strenv(SILO_IMAGE)" /tmp/silo-deployment.yaml'
    - 'yq -i ".spec.template.spec.containers[0].image = strenv(DISPATCHER_IMAGE)" /tmp/dispatcher-deployment.yaml'
    - 'yq -i ".spec.template.spec.containers[0].image = strenv(IDP_IMAGE)" /tmp/idp-deployment.yaml'

    - 'grep "image:" /tmp/order-deployment.yaml'
    - 'grep "image:" /tmp/user-deployment.yaml'
    - 'grep "image:" /tmp/financial-deployment.yaml'
    - 'grep "image:" /tmp/silo-deployment.yaml'
    - 'grep "image:" /tmp/dispatcher-deployment.yaml'
    - 'grep "image:" /tmp/idp-deployment.yaml'

    - 'curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" --form "branch=main" --form "commit_message=ci: update OrderManagement image to $IMAGE_TAG [skip ci]" --form "content=< /tmp/order-deployment.yaml" "$GITLAB_API/projects/$PROJECT/repository/files/$ORDER_FILE"'

    - 'curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" --form "branch=main" --form "commit_message=ci: update UserManagement image to $IMAGE_TAG [skip ci]" --form "content=< /tmp/user-deployment.yaml" "$GITLAB_API/projects/$PROJECT/repository/files/$USER_FILE"'

    - 'curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" --form "branch=main" --form "commit_message=ci: update Financial image to $IMAGE_TAG [skip ci]" --form "content=< /tmp/financial-deployment.yaml" "$GITLAB_API/projects/$PROJECT/repository/files/$FINANCIAL_FILE"'

    - 'curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" --form "branch=main" --form "commit_message=ci: update Silo image to $IMAGE_TAG [skip ci]" --form "content=< /tmp/silo-deployment.yaml" "$GITLAB_API/projects/$PROJECT/repository/files/$SILO_FILE"'

    - 'curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" --form "branch=main" --form "commit_message=ci: update Dispatcher image to $IMAGE_TAG [skip ci]" --form "content=< /tmp/dispatcher-deployment.yaml" "$GITLAB_API/projects/$PROJECT/repository/files/$DISPATCHER_FILE"'

    - 'curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" --form "branch=main" --form "commit_message=ci: update IDP image to $IMAGE_TAG [skip ci]" --form "content=< /tmp/idp-deployment.yaml" "$GITLAB_API/projects/$PROJECT/repository/files/$IDP_FILE"'

    - echo "Kubernetes manifests updated successfully."

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'