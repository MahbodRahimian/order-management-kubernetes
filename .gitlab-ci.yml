cache:
  key: "nuget-$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/

stages:
  - build
  - docker

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

  ORDER_IMAGE_NAME: "$NEXUS_REGISTRY/order-management/order-management-api"
  USER_IMAGE_NAME: "$NEXUS_REGISTRY/order-management/usermanagement-api"
  FINANCIAL_IMAGE_NAME: "$NEXUS_REGISTRY/order-management/financial-api"
  SILO_IMAGE_NAME: "$NEXUS_REGISTRY/order-management/silo-api"
  DISPATCHER_IMAGE_NAME: "$NEXUS_REGISTRY/order-management/dispatcher-api"
  IDP_IMAGE_NAME: "$NEXUS_REGISTRY/order-management/idp-api"

  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"


build_ordermanagement_api:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0

  script:
    - dotnet --version
    - dotnet restore src/OrderManagement.API/OrderManagement.API.csproj
    - dotnet build src/OrderManagement.API/OrderManagement.API.csproj --no-restore --configuration Release

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success


