# ============================================================
# Cache
# ============================================================

cache:
  key: "nuget-$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/


# ============================================================
# Pipeline Stages
# ============================================================

stages:
  - build
  - docker


# ============================================================
# Global Variables
# ============================================================

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

  NEXUS_REGISTRY: "$NEXUS_REGISTRY"

  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  ORDER_IMAGE_NAME: "$NEXUS_REGISTRY/order-management/order-management-api"
  USER_IMAGE_NAME: "$NEXUS_REGISTRY/order-management/usermanagement-api"
  FINANCIAL_IMAGE_NAME: "$NEXUS_REGISTRY/order-management/financial-api"
  SILO_IMAGE_NAME: "$NEXUS_REGISTRY/order-management/silo-api"
  DISPATCHER_IMAGE_NAME: "$NEXUS_REGISTRY/order-management/dispatcher-api"
  IDP_IMAGE_NAME: "$NEXUS_REGISTRY/order-management/idp-api"


# ============================================================
# Build Template
# ============================================================

.build_template:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0

  script:
    - dotnet --version
    - dotnet restore "$PROJECT_FILE"
    - dotnet build "$PROJECT_FILE" --no-restore --configuration Release

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success


# ============================================================
# Docker Build & Push Template
# ============================================================

.docker_template:
  stage: docker
  image: docker:27-cli

  script:
    - docker --version
    - docker info | grep -A10 -i "Insecure Registries"
    - docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" -p "$NEXUS_PASSWORD"
    - docker build -f "$DOCKERFILE" -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - echo "Image pushed: ${IMAGE_NAME}:${IMAGE_TAG}"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success


# ============================================================
# Build Jobs
# ============================================================

build_ordermanagement_api:
  extends: .build_template
  variables:
    PROJECT_FILE: "src/OrderManagement.API/OrderManagement.API.csproj"


build_usermanagement_api:
  extends: .build_template
  variables:
    PROJECT_FILE: "src/UserManagement.API/UserManagement.API.csproj"


build_financial_api:
  extends: .build_template
  variables:
    PROJECT_FILE: "src/Financial.API/Financial.API.csproj"


build_silo_api:
  extends: .build_template
  variables:
    PROJECT_FILE: "src/Silo.API/Silo.API.csproj"


build_dispatcher_api:
  extends: .build_template
  variables:
    PROJECT_FILE: "src/Dispatcher.API/Dispatcher.API.csproj"


build_idp_api:
  extends: .build_template
  variables:
    PROJECT_FILE: "src/IDP.API/IDP.API.csproj"


# ============================================================
# Docker Build & Push Jobs
# ============================================================

docker_build_push_ordermanagement:
  extends: .docker_template
  variables:
    IMAGE_NAME: "$ORDER_IMAGE_NAME"
    DOCKERFILE: "src/OrderManagement.API/Dockerfile"


docker_build_push_usermanagement:
  extends: .docker_template
  variables:
    IMAGE_NAME: "$USER_IMAGE_NAME"
    DOCKERFILE: "src/UserManagement.API/Dockerfile"


docker_build_push_financial:
  extends: .docker_template
  variables:
    IMAGE_NAME: "$FINANCIAL_IMAGE_NAME"
    DOCKERFILE: "src/Financial.API/Dockerfile"


docker_build_push_silo:
  extends: .docker_template
  variables:
    IMAGE_NAME: "$SILO_IMAGE_NAME"
    DOCKERFILE: "src/Silo.API/Dockerfile"


docker_build_push_dispatcher:
  extends: .docker_template
  variables:
    IMAGE_NAME: "$DISPATCHER_IMAGE_NAME"
    DOCKERFILE: "src/Dispatcher.API/Dockerfile"


docker_build_push_idp:
  extends: .docker_template
  variables:
    IMAGE_NAME: "$IDP_IMAGE_NAME"
    DOCKERFILE: "src/IDP.API/Dockerfile"


# ============================================================
# Update Kubernetes Manifests
# ============================================================

update_kubernetes_manifests:
  stage: docker
  image: docker:27-cli

  needs:
    - docker_build_push_ordermanagement
    - docker_build_push_usermanagement
    - docker_build_push_financial
    - docker_build_push_silo
    - docker_build_push_dispatcher
    - docker_build_push_idp

  before_script:
    - apk add --no-cache curl yq
    - yq --version

  script:
    # --------------------------------------------------------
    # GitLab API configuration
    # --------------------------------------------------------

    - export GITLAB_API="http://gitlab.mahbod.com:8080/api/v4"
    - export PROJECT="mahbod1%2Forder-management"
    - export BRANCH="main"

    # --------------------------------------------------------
    # Image references
    # --------------------------------------------------------

    - export ORDER_IMAGE="${ORDER_IMAGE_NAME}:${IMAGE_TAG}"
    - export USER_IMAGE="${USER_IMAGE_NAME}:${IMAGE_TAG}"
    - export FINANCIAL_IMAGE="${FINANCIAL_IMAGE_NAME}:${IMAGE_TAG}"
    - export SILO_IMAGE="${SILO_IMAGE_NAME}:${IMAGE_TAG}"
    - export DISPATCHER_IMAGE="${DISPATCHER_IMAGE_NAME}:${IMAGE_TAG}"
    - export IDP_IMAGE="${IDP_IMAGE_NAME}:${IMAGE_TAG}"

    # --------------------------------------------------------
    # Show images that will be deployed
    # --------------------------------------------------------

    - echo "OrderManagement image: $ORDER_IMAGE"
    - echo "UserManagement image: $USER_IMAGE"
    - echo "Financial image: $FINANCIAL_IMAGE"
    - echo "Silo image: $SILO_IMAGE"
    - echo "Dispatcher image: $DISPATCHER_IMAGE"
    - echo "IDP image: $IDP_IMAGE"

    # --------------------------------------------------------
    # Function:
    # Get manifest -> Decode -> Update image -> Verify -> Commit
    # --------------------------------------------------------

    - |
      update_manifest() {
        local file_path="$1"
        local image="$2"
        local name="$3"

        local encoded_file
        local response_file
        local manifest_file

        encoded_file=$(printf '%s' "$file_path" | sed 's|/|%2F|g')

        response_file="/tmp/${name}-response.json"
        manifest_file="/tmp/${name}-deployment.yaml"

        echo "=============================================="
        echo "Updating manifest: $file_path"
        echo "Image: $image"
        echo "=============================================="

        echo "Downloading manifest from GitLab..."

        curl --fail --silent --show-error \
          --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" \
          "$GITLAB_API/projects/$PROJECT/repository/files/$encoded_file?ref=$BRANCH" \
          -o "$response_file"

        echo "Decoding manifest..."

        yq -r ".content" "$response_file" | base64 -d > "$manifest_file"

        echo "Updating image..."

        IMAGE="$image" yq -i \
          '.spec.template.spec.containers[0].image = strenv(IMAGE)' \
          "$manifest_file"

        echo "Verifying image..."

        grep "image:" "$manifest_file"

        echo "Committing manifest..."

        curl --fail --silent --show-error \
          --request PUT \
          --header "PRIVATE-TOKEN: $CI_MANIFEST_TOKEN" \
          --form "branch=$BRANCH" \
          --form "commit_message=ci: update ${name} image to ${IMAGE_TAG} [skip ci]" \
          --form "content=<$manifest_file" \
          "$GITLAB_API/projects/$PROJECT/repository/files/$encoded_file"

        echo "Manifest updated successfully: $file_path"
      }

    # --------------------------------------------------------
    # Update all six services
    # --------------------------------------------------------

    - update_manifest "k8s/order-management/deployment.yaml" "$ORDER_IMAGE" "order-management"
    - update_manifest "k8s/usermanagement/deployment.yaml" "$USER_IMAGE" "usermanagement"
    - update_manifest "k8s/financial/deployment.yaml" "$FINANCIAL_IMAGE" "financial"
    - update_manifest "k8s/silo/deployment.yaml" "$SILO_IMAGE" "silo"
    - update_manifest "k8s/dispatcher/deployment.yaml" "$DISPATCHER_IMAGE" "dispatcher"
    - update_manifest "k8s/idp/deployment.yaml" "$IDP_IMAGE" "idp"

    - echo "=============================================="
    - echo "All Kubernetes manifests updated successfully."
    - echo "Image tag: $IMAGE_TAG"
    - echo "=============================================="

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success