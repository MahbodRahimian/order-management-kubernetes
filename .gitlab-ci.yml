cache:
  key: "nuget-$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/

stages:
  - build
  - docker

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

  IMAGE_NAME: "$NEXUS_REGISTRY/order-management/order-management-api"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"


build_ordermanagement_api:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0

  script:
    - dotnet --version
    - dotnet restore src/OrderManagement.API/OrderManagement.API.csproj
    - dotnet build src/OrderManagement.API/OrderManagement.API.csproj --no-restore --configuration Release

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success



build_usermanagement_api:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0

  script:
    - dotnet --version
    - dotnet restore src/UserManagement.API/UserManagement.API.csproj
    - dotnet build src/UserManagement.API/UserManagement.API.csproj --no-restore --configuration Release

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success



docker_build_push:
  stage: docker
  image: docker:27-cli

  script:
    - docker --version
    - docker info | grep -A10 -i "Insecure Registries"
    - docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" -p "$NEXUS_PASSWORD"
    - docker build -f src/OrderManagement.API/Dockerfile -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - 'echo "Image pushed: ${IMAGE_NAME}:${IMAGE_TAG}"'

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'




docker_build_push_usermanagement:
  stage: docker
  image: docker:27-cli

  script:
    - docker --version
    - docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" -p "$NEXUS_PASSWORD"
    - docker build -f src/UserManagement.API/Dockerfile -t "$NEXUS_REGISTRY/order-management/usermanagement-api:$CI_COMMIT_SHORT_SHA" .
    - docker push "$NEXUS_REGISTRY/order-management/usermanagement-api:$CI_COMMIT_SHORT_SHA"
    - 'echo "Image pushed: ${NEXUS_REGISTRY}/order-management/usermanagement-api:${CI_COMMIT_SHORT_SHA}"'

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
      when: on_success